<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Feel Log</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <main>
    <section id="login-screen">

      <h1>Feel Log</h1>

      <p>Seu espaço.</p>

      <form id="login-form">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          autocomplete="email"
          required
        >

        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          Entrar
        </button>

        <p id="login-error"></p>

      </form>

    </section>


    <section id="app-screen" hidden>

      <h1>Como você está hoje?</h1>

      <p>
        O diário está conectado.
      </p>

      <button id="logout-button">
        Sair
      </button>

    </section>

  </main>

  <script type="module" src="./js/app.js"></script>

</body>
</html>
